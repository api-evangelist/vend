aid: vend
name: Vend
description: Vend was a cloud-based retail point-of-sale and inventory management
  software company founded in Auckland, New Zealand, backed by investors including
  Point Nine. Lightspeed announced its acquisition of Vend in March 2021 for approximately
  US$350 million, and the product lives on as Lightspeed Retail (X-Series). vendhq.com
  redirects to lightspeedhq.com/vend/, and the former Vend API is documented today
  at x-series-api.lightspeedhq.com. The X-Series API surface is profiled in the API
  Evangelist network under the Lightspeed provider, so this profile records the acquired
  Vend brand rather than duplicating that API.
